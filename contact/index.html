<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Wonjun Jo by email.">
    <meta name="theme-color" content="#1d3954">
    <title>Contact | Wonjun Jo</title>
    <link rel="canonical" href="https://jo1jun.github.io/contact/">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/stylesheet.css?v=20261014-5">
    <link rel="stylesheet" href="contact.css?v=20261015-1">
    <script src="contact.js?v=20261015-1" defer></script>
  </head>
  <body class="contact-page">
    <div class="top-hero" aria-hidden="true"></div>
    <main class="page-shell contact-card">
      <a class="back-link" href="/">&larr; Homepage</a>
      <p class="contact-eyebrow">Get in touch</p>
      <h1>Wonjun Jo</h1>
      <label for="email-address">Email</label>
      <div class="email-address-row">
        <input id="email-address" type="text" value="jo1jun@postech.ac.kr" readonly spellcheck="false" autocapitalize="off" aria-describedby="contact-help">
        <button id="copy-email" type="button" hidden>Copy address</button>
      </div>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <nav class="compose-options" aria-label="Write an email">
        <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=jo1jun%40postech.ac.kr" target="_blank" rel="noopener noreferrer">Gmail</a>
        <a href="https://outlook.office.com/mail/deeplink/compose?to=jo1jun%40postech.ac.kr" target="_blank" rel="noopener noreferrer">Outlook (Microsoft 365)</a>
        <a href="mailto:jo1jun@postech.ac.kr">Default mail app</a>
      </nav>
      <p id="contact-help" class="contact-help">If your mail service does not open, copy the address into your preferred email app.</p>
    </main>
  </body>
</html>
