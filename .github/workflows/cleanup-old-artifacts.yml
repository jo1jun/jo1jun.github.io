name: Remove superseded research deployment artifacts

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-old-artifacts.yml]

permissions:
  actions: write

jobs:
  cleanup:
    if: github.repository == 'jo1jun/jo1jun.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the audited deployment archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          # Each ID was checked against its source tree before this cleanup.
          # No checkout, credential persistence, or external actions are needed.
          targets = [
              11671965618, 11671796159, 11671620513, 11670826489,
              11670780273, 11670638252, 11670557908, 11670456017,
              11670192460, 11670060050, 11669821855, 11669551700,
              11669164785, 11668897136, 11668895385, 11668855251,
              11668780588, 11668474717, 11668459680, 11668393290,
              11668385481, 11668353251, 11668217424, 11667959910,
              11667866606, 11667833522, 11667773027,
          ]
          base = 'https://api.github.com/repos/jo1jun/jo1jun.github.io/actions/artifacts/'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'audited-research-artifact-cleanup',
          }
          removed = already_absent = 0
          for artifact_id in targets:
              url = base + str(artifact_id)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      artifact = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      already_absent += 1
                      continue
                  raise
              assert artifact['id'] == artifact_id
              assert artifact['name'] == 'github-pages'
              assert artifact['created_at'] < '2026-10-10T14:14:00Z'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method='DELETE'), timeout=30) as response:
                  assert response.status == 204
              removed += 1
          print(f'Deleted {removed} audited archives; {already_absent} already absent.')
          PY
